<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login — WheelWise</title>
    <meta name="description" content="Secure Administrator Sign-In portal for WheelWise Vehicle Rental Management.">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Admin Styles -->
    <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <div class="text-center">
                <div class="admin-brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <h3 class="fw-bold text-white mb-1">WheelWise Admin</h3>
                <p class="text-muted small mb-4">Vehicle Rental Management System</p>
            </div>

            <!-- Login Alert -->
            <div id="adminLoginAlert" class="alert alert-danger d-none py-2 px-3 small mb-3" role="alert"></div>

            <form id="adminLoginForm" novalidate>
                <div class="mb-3">
                    <label for="adminEmail" class="form-label text-muted small fw-semibold">Admin Email Address</label>
                    <input type="email" id="adminEmail" class="form-control admin-form-control" placeholder="admin@wheelwise.com" required autocomplete="username">
                    <div class="invalid-feedback">Please enter a valid administrator email address.</div>
                </div>

                <div class="mb-3">
                    <label for="adminPassword" class="form-label text-muted small fw-semibold">Password</label>
                    <div class="input-group">
                        <input type="password" id="adminPassword" class="form-control admin-form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="toggleAdminPassword">
                            Show
                        </button>
                    </div>
                    <div class="invalid-feedback">Password is required.</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberAdmin">
                        <label class="form-check-label text-muted small" for="rememberAdmin">
                            Remember session
                        </label>
                    </div>
                </div>

                <button type="submit" id="btnAdminLogin" class="btn btn-primary w-100 py-2 fw-semibold">
                    Sign In to Admin Panel
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary">
                <a href="login.html" class="text-muted small text-decoration-none">
                    &larr; Switch to Customer Website Login
                </a>
            </div>
        </div>
    </div>

    <!-- jQuery & Bootstrap Bundle JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Admin Logic -->
    <script src="js/admin.js"></script>
</body>
</html>
