<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | WheelWise — Vehicle Booking</title>

    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <!-- =============================================
         REGISTER SCREEN
         After valid registration → login.html
         ============================================= -->
    <section id="register" class="auth-screen d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-9 col-lg-7 col-xl-6">

                    <!-- Auth card -->
                    <div class="auth-card">

                        <!-- Branding -->
                        <div class="auth-brand text-center">
                            <div class="auth-logo d-inline-flex align-items-center justify-content-center">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WheelWise car logo">
                                    <path d="M5.4 11.5 6.8 8.3a2.2 2.2 0 0 1 2-1.3h6.4a2.2 2.2 0 0 1 2 1.3l1.4 3.2"
                                          stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M3.6 11.5h16.8a1 1 0 0 1 1 1v3.4a2 2 0 0 1-2 2h-1.7a2.3 2.3 0 0 0-4.6 0h-4.2a2.3 2.3 0 0 0-4.6 0H4.6a2 2 0 0 1-2-2v-3.4a1 1 0 0 1 1-1z"
                                          stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
                                    <circle cx="7.4" cy="17.4" r="1.05" stroke="#fff" stroke-width="1.4"/>
                                    <circle cx="16.6" cy="17.4" r="1.05" stroke="#fff" stroke-width="1.4"/>
                                </svg>
                            </div>
                            <h1 class="auth-title">Wheel<span class="text-accent">Wise</span></h1>
                            <h2 class="auth-welcome">Create Account</h2>
                            <p class="auth-subtext mb-0">Join WheelWise to book vehicles in minutes.</p>
                        </div>

                        <!-- Register form -->
                        <form id="regForm" novalidate>

                            <!-- Full Name + Phone (two columns on ≥sm) -->
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <div class="mb-3" id="nameGroup">
                                        <label class="form-label" for="regName">Full Name</label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                    <circle cx="12" cy="8" r="4"/>
                                                    <path d="M20 21a8 8 0 0 0-16 0"/>
                                                </svg>
                                            </span>
                                            <input type="text" class="form-control" id="regName" name="fullName"
                                                   placeholder="e.g. Alex Johnson" autocomplete="name">
                                        </div>
                                        <div class="invalid-feedback" id="nameError"></div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="mb-3" id="phoneGroup">
                                        <label class="form-label" for="regPhone">Phone Number</label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                    <rect x="5" y="2" width="14" height="20" rx="2"/>
                                                    <line x1="12" y1="18" x2="12.01" y2="18"/>
                                                </svg>
                                            </span>
                                            <input type="tel" class="form-control" id="regPhone" name="phone"
                                                   placeholder="e.g. +1 555 010 2030" autocomplete="tel">
                                        </div>
                                        <div class="invalid-feedback" id="phoneError"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3" id="regEmailGroup">
                                <label class="form-label" for="regEmail">Email address</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                        </svg>
                                    </span>
                                    <input type="email" class="form-control" id="regEmail" name="email"
                                           placeholder="you@example.com" autocomplete="email">
                                </div>
                                <div class="invalid-feedback" id="emailError"></div>
                            </div>

                            <!-- Password + Confirm Password (two columns on ≥sm) -->
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <div class="mb-3" id="regPasswordGroup">
                                        <label class="form-label" for="regPassword">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                                </svg>
                                            </span>
                                            <input type="password" class="form-control" id="regPassword" name="password"
                                                   placeholder="Min. 6 characters" autocomplete="new-password">
                                            <button type="button" class="btn btn-toggle-pw" id="toggleRegPassword"
                                                    aria-label="Show or hide password" title="Show / hide password">
                                                <svg id="regIconEyeShow" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                                                    <circle cx="12" cy="12" r="3"/>
                                                </svg>
                                                <svg id="regIconEyeHide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                     aria-hidden="true" style="display:none">
                                                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                                    <line x1="2" x2="22" y1="2" y2="22"/>
                                                </svg>
                                            </button>
                                        </div>
                                        <div class="invalid-feedback" id="passwordError"></div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="mb-3" id="regConfirmGroup">
                                        <label class="form-label" for="regConfirm">Confirm Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                                    <path d="m9 15 2 2 4-4"/>
                                                </svg>
                                            </span>
                                            <input type="password" class="form-control" id="regConfirm" name="confirmPassword"
                                                   placeholder="Re-enter password" autocomplete="new-password">
                                            <button type="button" class="btn btn-toggle-pw" id="toggleRegConfirm"
                                                    aria-label="Show or hide confirm password" title="Show / hide password">
                                                <svg id="regConfirmIconEyeShow" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                                                    <circle cx="12" cy="12" r="3"/>
                                                </svg>
                                                <svg id="regConfirmIconEyeHide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                     aria-hidden="true" style="display:none">
                                                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                                    <line x1="2" x2="22" y1="2" y2="22"/>
                                                </svg>
                                            </button>
                                        </div>
                                        <div class="invalid-feedback" id="confirmError"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Terms & Conditions -->
                            <div class="mb-4" id="termsGroup">
                                <div class="form-check register-terms">
                                    <input class="form-check-input" type="checkbox" id="termsCheck">
                                    <label class="form-check-label" for="termsCheck">
                                        I agree to the <a href="#" class="auth-link">Terms &amp; Conditions</a> and
                                        <a href="#" class="auth-link">Privacy Policy</a>.
                                    </label>
                                </div>
                                <div class="invalid-feedback" id="termsError"></div>
                            </div>

                            <!-- Create Account button -->
                            <button type="submit" class="btn btn-login w-100" id="btnRegister">Create Account</button>

                            <!-- Login switch -->
                            <p class="auth-switch text-center mt-3 mb-0">
                                Already have an account?
                                <a href="login.html" class="auth-link">Login</a>
                            </p>
                        </form>

                    </div>

                    <!-- Footer -->
                    <p class="auth-foot text-center mt-4">
                        WheelWise &middot; Vehicle Booking &middot; Full Stack Course Project
                    </p>

                </div>
            </div>
        </div>
    </section>

    <!-- jQuery (CDN) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS bundle (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth logic (login + register) -->
    <script src="js/auth.js"></script>

</body>
</html>
